<text x="1230" y="827" class="s">FastEthernet0 ↔ Fa0/2 · SSH client</text>
<rect x="15" y="896" width="1570" height="146" rx="10" class="box"/>
<text x="35" y="930" class="h">CABLING / POLICY / OBSERVATION</text>
<text x="35" y="961" class="t">PC/server-to-switch and R1-to-CORE: straight-through · switch-to-switch: crossover or automatic cable selection</text>
<text x="35" y="991" class="t">All hosts DNS = 192.168.20.53 · switch SVI gateway = local .1 · observe packets in Simulation → Event List → PDU Details</text>
<text x="35" y="1021" class="t">Optional ATTACK-IN ACL on R1 G0/0.10 inbound: allow DNS + DMZ HTTP; block other IPv4. SYSLOG is not packet capture.</text>
