<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs><style>text{font-family:Arial,sans-serif;fill:#19324b}.h{font-size:24px;font-weight:bold}.t{font-size:18px}.s{font-size:16px}.box{fill:white;stroke:#67839d;stroke-width:2}.wire{fill:none;stroke:#476d8c;stroke-width:4}</style></defs>
<rect width="1600" height="1060" fill="#f3f7fc"/>
<text x="30" y="44" font-size="32" font-weight="bold">PACKET TRACER · ISOLATED IDS TRAFFIC LAB</text>
<text x="30" y="77" class="t">All masks: 255.255.255.0 · static IPv4 · four VLANs · no Internet link · gateways on R1</text>
<rect x="460" y="105" width="680" height="135" rx="12" class="box"/>
<text x="480" y="138" class="h">R1 · Cisco 2911 · router-on-a-stick</text>
<text x="480" y="167" class="t">G0/0 trunk ↔ CORE G0/1 · physical G0/0 has no IP</text>
<text x="480" y="195" class="t">G0/0.10: 192.168.10.1 · G0/0.20: 192.168.20.1</text>
<text x="480" y="223" class="t">G0/0.30: 192.168.30.1 · G0/0.40: 192.168.40.1</text>
<path d="M800 240 V290" class="wire"/>
<rect x="440" y="290" width="720" height="116" rx="12" class="box"/>
<text x="460" y="324" class="h">SW-CORE · Cisco 2960-24TT</text>
<text x="460" y="355" class="t">G0/1 trunk allows VLANs 10,20,30,40 · SVI VLAN 40: .40.3</text>
<text x="460" y="385" class="t">Fa0/1 → A · Fa0/2 → B · Fa0/3 → DMZ · Fa0/4 → MON</text>
<path d="M520 406 V438 H200 V485 M700 406 V452 H600 V485 M900 406 V452 H1000 V485 M1080 406 V438 H1400 V485" class="wire"/>
