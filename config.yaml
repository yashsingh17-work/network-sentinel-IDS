# Network Sentinel's portable, source-agnostic default configuration.
sources:
  packet_capture:
    enabled: true
    interface: auto
    auto_start: true
  zeek:
    enabled: false
  suricata:
    enabled: false
  windows_events:
    enabled: false
  synthetic:
    enabled: true
  # Read-only local observation. Files are never opened as programs or sent away.
  download_monitor:
    enabled: true
    directories: []
    interval_seconds: 2
    max_files: 1000
    hash_max_bytes: 134217728

storage:
  backend: sqlite
  database_path: network_sentinel.db

dashboard:
  # Smooth throughput over five seconds instead of flashing from a burst to zero.
  rate_window_seconds: 5

enrichment:
  # Uses your configured DNS resolver to find PTR/host names for public IPs.
  reverse_dns_enabled: true
  # Disabled: enabling this sends a public IP address to the configured provider.
  country_lookup_enabled: false
  country_lookup_url: "https://ipwho.is/{ip}"
  cache_seconds: 86400

detection:
  port_scan_port_threshold: 50
  port_scan_time_window_seconds: 10
  syn_rate_threshold: 100
  syn_time_window_seconds: 1
  traffic_rate_threshold: 1000
  traffic_rate_window_seconds: 1
  icmp_sweep_destination_threshold: 20
  icmp_sweep_time_window_seconds: 10
  dns_query_rate_threshold: 100
  dns_query_time_window_seconds: 10
  arp_conflict_time_window_seconds: 120
  arp_conflict_mac_threshold: 2
  auth_failure_threshold: 5
  auth_failure_time_window_seconds: 300
  suspicious_auth_sequence_window_seconds: 600
  alert_cooldown_seconds: 60

# Optional: send normalized events to a locally managed Node-RED flow.
orchestration:
  node_red_webhook_url: null

# Keep this local unless you explicitly choose a cloud reputation provider.
# Entries may be full domains, such as "known-bad.example".
threat_intelligence:
  unsafe_domains: []
