<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title description">
  <title id="title">Network Sentinel Packet Tracer hybrid demonstration layout</title>
  <desc id="description">A safe dummy network with an outside test host, ISP router, firewall, DMZ, core switch, user, admin and guest Wi-Fi segments, and an IDS or IPS sensor.</desc>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #e8f0f2; }
    .title { font-size: 31px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #a8c0c7; }
    .zone { stroke-width: 2; rx: 18; }
    .zone-label { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .device { fill: #13262d; stroke: #4adbc7; stroke-width: 2; rx: 10; }
    .device-title { font-size: 15px; font-weight: 700; }
    .device-detail { font-size: 12px; fill: #a8c0c7; }
    .link { fill: none; stroke: #7d98a0; stroke-width: 3; }
    .inspect { fill: none; stroke: #f5c45b; stroke-width: 3; stroke-dasharray: 8 7; }
    .callout { font-size: 13px; fill: #f5c45b; }
  </style>
  <rect width="1600" height="930" fill="#071014"/>
  <text x="60" y="58" class="title">Network Sentinel · Packet Tracer Demo Lab</text>
  <text x="60" y="86" class="subtitle">Visual simulator on the left and centre; Network Sentinel receives matching, safe local-only demo events.</text>

  <rect x="48" y="130" width="275" height="550" class="zone" fill="#26171a" stroke="#b86068"/>
  <text x="72" y="162" class="zone-label" fill="#ffabb0">OUTSIDE / UNTRUSTED</text>
  <rect x="83" y="215" width="205" height="78" class="device"/>
  <text x="102" y="245" class="device-title">Attacker-PC</text>
  <text x="102" y="267" class="device-detail">198.18.0.10</text>
  <text x="102" y="284" class="device-detail">Fictional test host</text>
  <rect x="83" y="405" width="205" height="78" class="device"/>
  <text x="102" y="435" class="device-title">ISP-Router</text>
  <text x="102" y="457" class="device-detail">198.18.0.254</text>
  <text x="102" y="474" class="device-detail">2911 / cloud edge</text>
  <path d="M185 293 V405" class="link"/>

  <rect x="370" y="130" width="295" height="550" class="zone" fill="#2b2616" stroke="#d2ac49"/>
  <text x="394" y="162" class="zone-label" fill="#f5d77a">SECURITY EDGE</text>
  <rect x="415" y="285" width="205" height="90" class="device"/>
  <text x="438" y="318" class="device-title">ASA-EDGE Firewall</text>
  <text x="438" y="340" class="device-detail">Outside: 198.18.0.1</text>
  <text x="438" y="358" class="device-detail">NAT · ACL · policy logs</text>
  <path d="M288 444 H415" class="link"/>

  <rect x="710" y="130" width="398" height="550" class="zone" fill="#102528" stroke="#43b9ad"/>
  <text x="734" y="162" class="zone-label" fill="#77e5d9">DMZ</text>
  <rect x="752" y="250" width="145" height="80" class="device"/>
  <text x="771" y="281" class="device-title">DMZ-Switch</text>
  <text x="771" y="302" class="device-detail">172.16.40.0/24</text>
  <rect x="937" y="214" width="135" height="92" class="device"/>
  <text x="952" y="245" class="device-title">DMZ-Web-DNS</text>
  <text x="952" y="267" class="device-detail">172.16.40.10</text>
  <text x="952" y="284" class="device-detail">HTTPS · DNS</text>
  <rect x="937" y="411" width="135" height="92" class="device"/>
  <text x="956" y="442" class="device-title">ISR IDS/IPS</text>
  <text x="956" y="464" class="device-detail">Sensor role</text>
  <text x="956" y="481" class="device-detail">Inspect DMZ flow</text>
  <path d="M620 330 H752" class="link"/>
  <path d="M897 290 H937" class="link"/>
  <path d="M824 330 V457 H937" class="inspect"/>
  <text x="746" y="500" class="callout">dashed = inspection / mirror story</text>

  <rect x="1150" y="130" width="402" height="550" class="zone" fill="#14221b" stroke="#54b879"/>
  <text x="1174" y="162" class="zone-label" fill="#88e5a6">INTERNAL NETWORK</text>
  <rect x="1254" y="235" width="195" height="82" class="device"/>
  <text x="1274" y="266" class="device-title">Core-L3-Switch</text>
  <text x="1274" y="288" class="device-detail">VLAN gateways · routing</text>
  <rect x="1185" y="432" width="125" height="90" class="device"/>
  <text x="1205" y="463" class="device-title">User-PCs</text>
  <text x="1205" y="485" class="device-detail">VLAN 10</text>
  <rect x="1358" y="432" width="125" height="90" class="device"/>
  <text x="1377" y="463" class="device-title">Admin-PC</text>
  <text x="1377" y="485" class="device-detail">VLAN 30</text>
  <path d="M1108 330 H1254" class="link"/>
  <path d="M1350 317 V432 H1247" class="link"/>
  <path d="M1350 317 V432 H1420" class="link"/>

  <rect x="1125" y="727" width="427" height="145" class="zone" fill="#182135" stroke="#7188e8"/>
  <text x="1149" y="760" class="zone-label" fill="#a9b8ff">GUEST WI-FI · VLAN 50</text>
  <rect x="1172" y="781" width="137" height="60" class="device"/>
  <text x="1193" y="816" class="device-title">Guest-AP</text>
  <rect x="1362" y="781" width="137" height="60" class="device"/>
  <text x="1373" y="816" class="device-title">Guest-Laptop</text>
  <path d="M1309 811 H1362" class="link"/>
  <path d="M1240 727 V610 H1350 V522" class="link"/>

  <rect x="48" y="727" width="1012" height="145" class="zone" fill="#102328" stroke="#37d9c5"/>
  <text x="74" y="760" class="zone-label" fill="#75eadd">NETWORK SENTINEL (LOCAL COMPUTER)</text>
  <text x="74" y="792" class="subtitle">Dashboard receives safe local scenario events: port scan · login burst · ARP conflict · IDS signature.</text>
  <text x="74" y="823" class="subtitle">Real deployment sources can later include packet capture, Zeek logs, Suricata alerts, firewall logs, and Windows events.</text>
  <text x="74" y="848" class="callout">Packet Tracer frames are simulated; the matching dashboard records are intentionally labelled “packet_tracer_demo”.</text>
</svg>
